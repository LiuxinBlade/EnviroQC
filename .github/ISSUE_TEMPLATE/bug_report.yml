name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not attach confidential or personal data.** Reduce the problem to a small synthetic file.
  - type: input
    id: version
    attributes:
      label: EnviroQC version
      description: Output of `enviroqc --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: Python 3.12, Windows 11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened (full output)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal rules file and synthetic data
      description: Paste a few lines, or attach small files.
