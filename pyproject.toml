[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enviroqc"
version = "0.1.0"
description = "An open-source data quality toolkit for environmental monitoring datasets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EnviroQC contributors" }]
keywords = [
    "environmental monitoring",
    "data quality",
    "validation",
    "csv",
    "excel",
    "qa/qc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    "pandas>=2.0",
]

[project.scripts]
enviroqc = "enviroqc.cli:main"

[project.urls]
Homepage = "https://github.com/LiuxinBlade/EnviroQC"
Documentation = "https://github.com/LiuxinBlade/EnviroQC/tree/main/docs"
Issues = "https://github.com/LiuxinBlade/EnviroQC/issues"
Changelog = "https://github.com/LiuxinBlade/EnviroQC/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enviroqc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["enviroqc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "PTH", # prefer pathlib
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow non-ASCII (Chinese text, µg/m³)

[tool.ruff.format]
quote-style = "double"
